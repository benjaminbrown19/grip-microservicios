server.port=8082
spring.application.name=ms-productos

# Base de datos propia del microservicio (esquema grip_productos).
spring.datasource.url=jdbc:mysql://${GRIP_DB_HOST:localhost}:${GRIP_DB_PORT:3306}/${GRIP_DB_NAME:grip_productos}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=${GRIP_DB_USER:grip_app}
spring.datasource.password=${GRIP_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Incluye el motivo del error en las respuestas JSON (lo usa el frontend y la comunicacion entre servicios).
server.error.include-message=always

# Swagger detras del gateway: cada servicio publica su documento en una ruta distinta.
springdoc.api-docs.path=/api-docs/productos
springdoc.swagger-ui.path=/swagger-ui.html
# Este servicio publica la interfaz Swagger unificada con los documentos de los tres microservicios.
springdoc.swagger-ui.urls[0].name=usuarios
springdoc.swagger-ui.urls[0].url=/api-docs/usuarios
springdoc.swagger-ui.urls[1].name=productos
springdoc.swagger-ui.urls[1].url=/api-docs/productos
springdoc.swagger-ui.urls[2].name=ordenes
springdoc.swagger-ui.urls[2].url=/api-docs/ordenes
springdoc.swagger-ui.urls-primary-name=productos

# JWT (misma clave en los tres servicios) y CORS. Valores desde variables de entorno.
grip.jwt.secret=${GRIP_JWT_SECRET}
grip.cors.origins=${GRIP_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
