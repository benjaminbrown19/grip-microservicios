# GRIP Sneaker Store - Arquitectura de microservicios con Docker Compose.
# Uso (en EC2): cp .env.example .env  ->  completar claves  ->  ver README para construir y levantar.
name: grip-microservicios

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD en .env}
      MYSQL_USER: grip_app
      MYSQL_PASSWORD: ${GRIP_DB_PASSWORD:?Falta GRIP_DB_PASSWORD en .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    # Sin "ports": MySQL solo es accesible dentro de la red de Docker.

  ms-usuarios:
    build: ./ms-usuarios
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      GRIP_DB_HOST: mysql
      GRIP_DB_NAME: grip_usuarios
      GRIP_DB_USER: grip_app
      GRIP_DB_PASSWORD: ${GRIP_DB_PASSWORD}
      GRIP_JWT_SECRET: ${GRIP_JWT_SECRET:?Falta GRIP_JWT_SECRET en .env}
      GRIP_ADMIN_PASSWORD: ${GRIP_ADMIN_PASSWORD:?Falta GRIP_ADMIN_PASSWORD en .env}
      GRIP_VENDEDOR_PASSWORD: ${GRIP_VENDEDOR_PASSWORD:?Falta GRIP_VENDEDOR_PASSWORD en .env}
      GRIP_CORS_ORIGINS: ${GRIP_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    restart: unless-stopped

  ms-productos:
    build: ./ms-productos
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      GRIP_DB_HOST: mysql
      GRIP_DB_NAME: grip_productos
      GRIP_DB_USER: grip_app
      GRIP_DB_PASSWORD: ${GRIP_DB_PASSWORD}
      GRIP_JWT_SECRET: ${GRIP_JWT_SECRET}
      GRIP_CORS_ORIGINS: ${GRIP_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    restart: unless-stopped

  ms-ordenes:
    build: ./ms-ordenes
    depends_on:
      mysql:
        condition: service_healthy
      ms-productos:
        condition: service_started
    environment:
      GRIP_DB_HOST: mysql
      GRIP_DB_NAME: grip_ordenes
      GRIP_DB_USER: grip_app
      GRIP_DB_PASSWORD: ${GRIP_DB_PASSWORD}
      GRIP_JWT_SECRET: ${GRIP_JWT_SECRET}
      GRIP_CORS_ORIGINS: ${GRIP_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      # Comunicacion entre microservicios por nombre de servicio (DNS de Docker).
      GRIP_PRODUCTOS_URL: http://ms-productos:8082
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      - ms-usuarios
      - ms-productos
      - ms-ordenes
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  mysql_data:
