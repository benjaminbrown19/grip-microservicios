# API Gateway de GRIP: unico punto de entrada publico (puerto 80 del contenedor, 8080 en EC2).
# Reparte cada ruta /api/v1/... al microservicio que corresponde usando los nombres
# de la red de Docker (descubrimiento de servicios por DNS de Docker, sin Eureka).
server {
    listen 80;
    server_name _;

    # DNS interno de Docker: vuelve a resolver los nombres si un contenedor se reinicia.
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 2m;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    set $ms_usuarios  http://ms-usuarios:8081;
    set $ms_productos http://ms-productos:8082;
    set $ms_ordenes   http://ms-ordenes:8083;

    # API REST
    location /api/v1/auth/     { proxy_pass $ms_usuarios; }
    location /api/v1/productos { proxy_pass $ms_productos; }
    location /api/v1/ordenes   { proxy_pass $ms_ordenes; }

    # Documentacion OpenAPI de cada servicio + interfaz Swagger unificada (servida por ms-productos)
    location /api-docs/usuarios  { proxy_pass $ms_usuarios; }
    location /api-docs/productos { proxy_pass $ms_productos; }
    location /api-docs/ordenes   { proxy_pass $ms_ordenes; }
    location /swagger-ui         { proxy_pass $ms_productos; }

    # Estado del gateway
    location = /salud {
        default_type application/json;
        return 200 '{"servicio":"grip-gateway","estado":"ok"}';
    }

    # Cualquier otra ruta (incluida /internal/...) NO se publica.
    location / {
        default_type application/json;
        return 404 '{"error":"Ruta no encontrada en el gateway"}';
    }
}
